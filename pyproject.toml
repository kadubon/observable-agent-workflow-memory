[project]
name = "observable-agent-workflow-memory"
version = "0.2.0b0"
description = "Evidence-bound verified workflow memory kernel for long-running AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "K. Takahashi" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "agents",
  "memory",
  "rag",
  "workflow",
  "workflow-memory",
  "observable-only",
  "no-meta",
  "verification",
  "receipts",
  "action-gate",
  "llm-agents",
  "self-improvement",
]
dependencies = [
  "click>=8.3.3",
  "jsonschema>=4.22.0",
  "orjson>=3.10.0",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
llm = [
  "litellm>=1.75.0",
]
dev = [
  "pytest-cov>=7.0",
  "hypothesis>=6.0",
  "pip-audit>=2.9",
  "twine>=6.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-jsonschema>=4.23.0.20241208",
]

[dependency-groups]
integration = [
  "alt-foundry-kernel @ https://github.com/kadubon/alt-foundry-kernel/releases/download/v0.5.0/alt_foundry_kernel-0.5.0-py3-none-any.whl#sha256=cd6755db6d97f978300d978695dc70c19d64fdd11c58e0c6dc4c1fcb7db9f487",
  "collective-capability-runtime @ https://github.com/kadubon/collective-capability-runtime/releases/download/v1.8.0/collective_capability_runtime-1.8.0-py3-none-any.whl#sha256=97b2f3dc1f675c78246c362d211b71452b721b001e25dd2711263f34874f8b25",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "observable_agent_workflow_memory/resources/schemas"
"migrations" = "observable_agent_workflow_memory/resources/migrations"
"examples" = "observable_agent_workflow_memory/resources/examples"

[project.scripts]
oawm = "observable_agent_workflow_memory.cli.app:main"

[project.entry-points."oawm.llm_providers"]
litellm = "observable_agent_workflow_memory.adapters.litellm_provider:create_provider"
mock = "observable_agent_workflow_memory.adapters.mock_llm:create_provider"

[project.entry-points."oawm.storage_backends"]
sqlite = "observable_agent_workflow_memory.adapters.sqlite_storage:create_storage"

[project.entry-points."oawm.retrievers"]
fts5 = "observable_agent_workflow_memory.adapters.fts_retriever:create_retriever"

[project.entry-points."oawm.checkers"]
default = "observable_agent_workflow_memory.adapters.jsonschema_checker:create_default_checkers"

[project.entry-points."oawm.proposers"]
deterministic = "observable_agent_workflow_memory.adapters.deterministic_proposer:create_proposer"

[project.entry-points."oawm.tool_adapters"]
local = "observable_agent_workflow_memory.adapters.local_tools:create_tool_adapter"

[project.entry-points."oawm.receipt_verifiers"]
default = "observable_agent_workflow_memory.adapters.receipt_verifier:create_verifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["observable_agent_workflow_memory"]
